{% extends "base.html" %}
{% block title %}Código QR{% endblock %}
{% block content %}
<div class="card">
  <h1>Código QR — {{ worker.name }}</h1>
  <p>Tipo de marca: <strong>{{ event_label }}</strong></p>
  <p><a href="{{ marcar_url }}">{{ marcar_url }}</a></p>
  <img src="{{ qr_image }}" alt="Código QR" style="max-width: 320px; width: 100%;">
  <p><a href="{{ url_for('terminal.index') }}">Volver al terminal</a></p>
</div>
{% endblock %}
